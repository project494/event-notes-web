<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Notes Web</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="container">
    <h1>Event Notes Web</h1>
    <p class="subtitle">
      Capture event sessions, keep notes, save contacts, and share your digital card.
    </p>
  </header>

  <main class="container">
    <section class="card">
      <h2>Welcome 👋</h2>
      <p>This is your first version. Keep it simple and ship fast.</p>
      <div class="button-row">
        <button id="createEventBtn">Create Event</button>
        <button id="viewCardBtn">View Digital Card</button>
      </div>
    </section>

    <section class="card hidden" id="eventPreviewCard" aria-live="polite">
      <h2>Event Preview</h2>
      <div id="eventPreview"></div>
    </section>
  </main>

  <div class="modal hidden" id="createEventModal" role="dialog" aria-modal="true" aria-labelledby="createEventTitle">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="createEventTitle">Create Event</h2>
        <button class="close-button" id="closeEventModalBtn" aria-label="Close create event modal">✕</button>
      </div>

      <div class="tab-row" role="tablist" aria-label="Create event methods">
        <button class="tab active" id="manualTab" role="tab" aria-selected="true" aria-controls="manualPanel">Type Event Info</button>
        <button class="tab" id="searchTab" role="tab" aria-selected="false" aria-controls="searchPanel">Find Existing Event</button>
      </div>

      <section id="manualPanel" class="tab-panel" role="tabpanel" aria-labelledby="manualTab">
        <form id="manualEventForm" class="form-grid">
          <label>
            Event Name
            <input type="text" id="eventName" required />
          </label>
          <label>
            Date
            <input type="date" id="eventDate" />
          </label>
          <label>
            Location
            <input type="text" id="eventLocation" />
          </label>
          <label>
            Website
            <input type="url" id="eventWebsite" placeholder="https://" />
          </label>
          <label class="full-width">
            Description
            <textarea id="eventDescription" rows="4" placeholder="What is this event about?"></textarea>
          </label>

          <div class="form-actions full-width">
            <button type="submit">Save Event</button>
          </div>
        </form>
      </section>

      <section id="searchPanel" class="tab-panel hidden" role="tabpanel" aria-labelledby="searchTab">
        <form id="searchEventForm" class="form-grid">
          <label class="full-width">
            Search Query
            <input type="text" id="eventSearchQuery" placeholder="e.g., React conference San Francisco 2026" required />
          </label>
          <label class="full-width">
            OpenRouter API Key (optional, for AI extraction)
            <input type="password" id="openRouterApiKey" placeholder="sk-or-v1-..." autocomplete="off" />
            <small>
              Uses a free model (<code>meta-llama/llama-3.1-8b-instruct:free</code>) to extract key details.
              Key is saved in your browser only.
            </small>
          </label>

          <div class="form-actions full-width">
            <button type="submit" id="runSearchBtn">Search + Extract Details</button>
          </div>
        </form>

        <p class="status" id="searchStatus"></p>

        <div id="searchResults" class="search-results hidden"></div>
      </section>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
